name: Publish docs site

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "hooks/**"
      - "overrides/**"
      - "tools/**"
      - "properdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/publish.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Pega as versões novas dos fetchers (documentação dos dados importada no build).
    - cron: "0 9 * * *"

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O plugin de data de revisão lê o histórico do git.
          fetch-depth: 0
          persist-credentials: false

      - name: Bibliotecas do plugin social (cards Open Graph)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Validar front-matter e modelo das páginas
        run: uv run --no-sync python tools/check_pages.py

      - name: Build documentation
        run: uv run --no-sync properdocs build --strict
        env:
          DADOS_FETCHERS_STRICT: "1"
          GOOGLE_ANALYTICS_KEY: ${{ secrets.GOOGLE_ANALYTICS_KEY }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          UMAMI_SCRIPT_URL: ${{ secrets.UMAMI_SCRIPT_URL }}

      - name: Conferir redirects das URLs antigas
        run: uv run --no-sync python tools/check_redirects.py site

      # Excluídos: portais gov.br e BCB que respondem 404/502 a clientes sem navegador
      # ou ficam fora do ar por horas; os links foram conferidos à mão.
      - name: Conferir links externos (aviso, não bloqueia)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        continue-on-error: true
        with:
          args: >-
            --no-progress --scheme https --max-concurrency 8 --max-retries 2
            --timeout 20 --accept 200..=299,403,429
            --exclude '^https://github.com/Quantilica/' --exclude '^https://docs.quantilica.com/'
            --exclude '^https://www.gov.br/' --exclude '^https://datasus.saude.gov.br/'
            --exclude '^https://www.tesourotransparente.gov.br/' --exclude '^https://www3.bcb.gov.br/'
            'site/**/*.html'
          fail: false

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "./site"

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  zizmor:
    name: Audit de workflows (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: false

      - name: Audit workflows with zizmor
        run: uvx zizmor --no-online-audits --min-severity high .github/workflows
