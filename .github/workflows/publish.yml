name: Publish docs site

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "hooks/**"
      - "overrides/**"
      - "tools/**"
      - "properdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/publish.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # O plugin de data de revisão lê o histórico do git.
          fetch-depth: 0

      - name: Bibliotecas do plugin social (cards Open Graph)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Validar front-matter e modelo das páginas
        run: uv run --no-sync python tools/check_pages.py

      - name: Build documentation
        run: uv run --no-sync properdocs build --strict
        env:
          GOOGLE_ANALYTICS_KEY: ${{ secrets.GOOGLE_ANALYTICS_KEY }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          UMAMI_SCRIPT_URL: ${{ secrets.UMAMI_SCRIPT_URL }}

      - name: Conferir redirects das URLs antigas
        run: uv run --no-sync python tools/check_redirects.py site

      - name: Conferir links externos (aviso, não bloqueia)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: >-
            --no-progress --scheme https --max-concurrency 8 --max-retries 2
            --timeout 20 --accept 200..=299,403,429
            --exclude '^https://github.com/Quantilica/' --exclude '^https://docs.quantilica.com/'
            'site/**/*.html'
          fail: false

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./site"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
