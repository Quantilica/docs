  - search:
      lang:
        - pt
        - en
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_source: false
  - git-revision-date-localized:
      type: date
      locale: pt
      fallback_to_build_date: true
  - social:
      cards_layout_options:
        background_color: "#3f51b5"
        color: "#ffffff"

hooks:
  - hooks/llms_txt.py

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false
  analytics:
    provider: custom
    property: !ENV [GOOGLE_ANALYTICS_KEY, ""]
    umami_website_id: !ENV [UMAMI_WEBSITE_ID, ""]
    umami_script_url: !ENV [UMAMI_SCRIPT_URL, "https://cloud.umami.is/script.js"]
  consent:
    title: Controle de Privacidade e Cookies
    description: >-
      Utilizamos cookies e tecnologias semelhantes para nos ajudar a entender como você utiliza o nosso site, melhorar a sua experiência e medir o tráfego de documentação. Ao aceitar, você concorda com o uso de cookies para fins de análise estatística.
    actions:
      - accept
      - reject
      - manage
    cookies:
      analytics: Google Analytics & Umami Analytics
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Quantilica
      name: Quantilica no GitHub
  mathjax_config:
    tex:
      inlineMath: [['$', '$'], ['\\(', '\\)']]
      displayMath: [['$$', '$$'], ['\\[', '\\]']]

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
