  - search:
      lang:
        - pt
        - en
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_source: false
  - git-revision-date-localized:
      type: date
      locale: pt
      fallback_to_build_date: true
  - social:
      cards_layout_options:
        background_color: "#3f51b5"
        color: "#ffffff"

hooks:
  - hooks/llms_txt.py
  - hooks/registro.py
  - hooks/dados_fetchers.py

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false
  # Grupos da seção "Fontes de dados" (nav e tabela de fontes/index.md). Quais
  # coletores existem, e em que pasta, vem do registro (hooks/registro.py);
  # aqui ficam só os textos e a ordem de apresentação.
  #   pasta   docs_pasta do registro (a ordem da lista é a da nav e da tabela)
  #   titulo  título do grupo na nav;  curto  nome do domínio na tabela
  #   fonte   coluna "Fonte oficial" da tabela
  #   ordem   opcional: ids de coletores e itens de nav literais (páginas que
  #           não são coletor); os coletores não citados vão ao fim, por id
  fontes_grupos:
    - pasta: ibge
      titulo: IBGE (Macroeconomia)
      curto: IBGE (Macroeconomia)
      fonte: IBGE SIDRA e Agregados
      ordem:
        - ibge-sidra
        - sidra-sql:
            - fontes/ibge/sidra-sql.md
            - Referência: fontes/ibge/sidra-sql/referencia.md
        - sidra-pipelines: fontes/ibge/sidra-pipelines.md
    - pasta: tesouro
      titulo: Tesouro (Finanças)
      curto: Tesouro (Finanças)
      fonte: Tesouro Nacional e PGFN
      ordem: [tesouro-direto, rtn, pgfn]
    - pasta: bcb
      titulo: Banco Central (BCB)
      curto: Banco Central
      fonte: BCB SGS e microdados
      ordem:
        - bcb-sgs
        - bcb-sgs-sql:
            - fontes/bcb/bcb-sgs-sql.md
            - Referência: fontes/bcb/bcb-sgs-sql/referencia.md
        - bcb-sgs-pipelines: fontes/bcb/bcb-sgs-pipelines.md
        - bcb-microdados
    - pasta: trabalho
      titulo: Mercado de Trabalho
      curto: Mercado de Trabalho
      fonte: MTE/PDET (CAGED, RAIS)
    - pasta: comex
      titulo: Comércio Exterior
      curto: Comércio Exterior
      fonte: MDIC/Comex Stat
    - pasta: saude
      titulo: Saúde Pública
      curto: Saúde Pública
      fonte: DATASUS
    - pasta: clima
      titulo: Clima & Meio Ambiente
      curto: Clima
      fonte: INMET BDMEP
    - pasta: aviacao
      titulo: Aviação Civil (ANAC)
      curto: Aviação Civil
      fonte: ANAC
    - pasta: petroleo
      titulo: Petróleo, Gás e Biocombustíveis (ANP)
      curto: Petróleo, Gás e Biocombustíveis
      fonte: ANP
    - pasta: educacao
      titulo: Educação (INEP)
      curto: Educação
      fonte: INEP e CAPES
      ordem: [inep, capes]
    - pasta: empresas
      titulo: Empresas (Receita Federal)
      curto: Empresas
      fonte: Receita Federal
    - pasta: mercado-capitais
      titulo: Mercado de Capitais (CVM e B3)
      curto: Mercado de Capitais
      fonte: CVM e B3
      ordem: [cvm, b3]
    - pasta: politica
      titulo: Política (TSE)
      curto: Política
      fonte: TSE
    - pasta: energia
      titulo: Energia Elétrica (ONS)
      curto: Energia Elétrica
      fonte: ONS
    - pasta: transportes
      titulo: Transportes (ANTT e Infosiga)
      curto: Transportes
      fonte: ANTT e Infosiga-SP (Detran-SP)
    - pasta: governo
      titulo: Governo e Transparência (SP)
      curto: Governo e Transparência
      fonte: Portal da Transparência de SP
    - pasta: loterias
      titulo: Loterias (Caixa)
      curto: Loterias
      fonte: Caixa Econômica Federal
    - pasta: ipea
      titulo: Ipeadata (Ipea)
      curto: Ipeadata
      fonte: Ipea
  analytics:
    provider: custom
    property: !ENV [GOOGLE_ANALYTICS_KEY, ""]
    umami_website_id: !ENV [UMAMI_WEBSITE_ID, ""]
    umami_script_url: !ENV [UMAMI_SCRIPT_URL, "https://cloud.umami.is/script.js"]
  consent:
    title: Controle de Privacidade e Cookies
    description: >-
      Utilizamos cookies e tecnologias semelhantes para nos ajudar a entender como você utiliza o nosso site, melhorar a sua experiência e medir o tráfego de documentação. Ao aceitar, você concorda com o uso de cookies para fins de análise estatística.
    actions:
      - accept
      - reject
      - manage
    cookies:
      analytics: Google Analytics & Umami Analytics
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Quantilica
      name: Quantilica no GitHub
  mathjax_config:
    tex:
      inlineMath: [['$', '$'], ['\\(', '\\)']]
      displayMath: [['$$', '$$'], ['\\[', '\\]']]

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
