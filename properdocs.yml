        aviacao/anac-fetcher.md: fontes/aviacao/anac-fetcher.md
        aviacao/index.md: fontes/aviacao/index.md
        bcb/bcb-sgs-fetcher.md: fontes/bcb/bcb-sgs-fetcher.md
        bcb/bcb-sgs-pipelines.md: fontes/bcb/bcb-sgs-pipelines.md
        bcb/bcb-sgs-sql.md: fontes/bcb/bcb-sgs-sql.md
        bcb/index.md: fontes/bcb/index.md
        clima/index.md: fontes/clima/index.md
        clima/inmet-fetcher.md: fontes/clima/inmet-fetcher.md
        comex/comex-fetcher.md: fontes/comex/comex-fetcher.md
        comex/index.md: fontes/comex/index.md
        concepts/arquitetura.md: conceitos/arquitetura.md
        concepts/bulk-load.md: conceitos/bulk-load.md
        concepts/calculo-retornos-renda-fixa.md: conceitos/calculo-retornos-renda-fixa.md
        concepts/index.md: conceitos/index.md
        concepts/padroes.md: conceitos/padroes.md
        concepts/parquet-polars.md: conceitos/parquet-polars.md
        concepts/principios.md: conceitos/principios.md
        concepts/proveniencia.md: conceitos/proveniencia.md
        concepts/storage.md: conceitos/storage.md
        cookbook/analise-economica-multi-fonte.md: guias/receitas/analise-economica-multi-fonte.md
        cookbook/balanca-duckdb.md: guias/receitas/balanca-duckdb.md
