site_name: Quantilica — Dados Públicos Brasileiros
site_description: Ferramentas resilientes em Python para extrair, normalizar e analisar dados públicos brasileiros — IBGE, Tesouro, DATASUS, INMET, CAGED, RAIS, Comex.
site_author: Quantilica
site_url: https://docs.quantilica.com
copyright: "Copyright &copy; 2026 Quantilica &bull; <a href=\"#__consent\">Alterar preferências de cookies</a>"

repo_url: https://github.com/Quantilica/docs
repo_name: Quantilica
edit_uri: blob/main/docs/

extra_css:
  - styles/site.css

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.ico
  language: pt-BR
  font:
    code: Google Sans Code
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - search.highlight
    - search.suggest
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro

nav:
  - Início:
      - index.md
      - Começar em 5 minutos: quickstart.md

  - Fontes de dados:
      - fontes/index.md
      - IBGE (Macroeconomia):
          - fontes/ibge/index.md
          - sidra-fetcher: fontes/ibge/sidra-fetcher.md
          - sidra-sql: fontes/ibge/sidra-sql.md
          - sidra-pipelines: fontes/ibge/sidra-pipelines.md
      - Tesouro (Finanças):
          - fontes/tesouro/index.md
          - tesouro-direto-fetcher: fontes/tesouro/tesouro-direto-fetcher.md
          - rtn-fetcher: fontes/tesouro/rtn-fetcher.md
      - Banco Central (BCB):
          - fontes/bcb/index.md
          - bcb-sgs-fetcher: fontes/bcb/bcb-sgs-fetcher.md
          - bcb-sgs-sql: fontes/bcb/bcb-sgs-sql.md
          - bcb-sgs-pipelines: fontes/bcb/bcb-sgs-pipelines.md
      - Mercado de Trabalho:
          - fontes/trabalho/index.md
          - pdet-fetcher: fontes/trabalho/pdet-fetcher.md
      - Comércio Exterior:
          - fontes/comex/index.md
          - comex-fetcher: fontes/comex/comex-fetcher.md
      - Saúde Pública:
          - fontes/saude/index.md
          - datasus-fetcher: fontes/saude/datasus-fetcher.md
      - Clima & Meio Ambiente:
          - fontes/clima/index.md
          - inmet-fetcher: fontes/clima/inmet-fetcher.md
      - Aviação Civil (ANAC):
          - fontes/aviacao/index.md
          - anac-fetcher: fontes/aviacao/anac-fetcher.md
      - Petróleo, Gás e Biocombustíveis (ANP):
          - fontes/petroleo/index.md
          - anp-fetcher: fontes/petroleo/anp-fetcher.md
      - Educação (INEP):
          - fontes/educacao/index.md
          - inep-fetcher: fontes/educacao/inep-fetcher.md
      - Empresas (Receita Federal):
          - fontes/empresas/index.md
          - rfb-cnpj-fetcher: fontes/empresas/rfb-cnpj-fetcher.md
      - Mercado de Capitais (CVM e B3):
          - fontes/mercado-capitais/index.md
          - cvm-fetcher: fontes/mercado-capitais/cvm-fetcher.md
          - b3-fetcher: fontes/mercado-capitais/b3-fetcher.md
      - Política (TSE):
          - fontes/politica/index.md
          - tse-fetcher: fontes/politica/tse-fetcher.md

  - Fundações:
      - fundacoes/index.md
      - quantilica-core: fundacoes/quantilica-core.md
      - quantilica-analytics: fundacoes/quantilica-analytics.md
      - quantilica-cli: fundacoes/quantilica-cli.md
      - quantilica-catalog: fundacoes/quantilica-catalog.md

  - Guias:
      - guias/index.md
      - Por perfil:
          - guias/perfis/index.md
          - Analista macroeconômico: guias/perfis/analista-macro.md
          - Cientista de saúde pública: guias/perfis/cientista-saude.md
          - Engenheiro de dados: guias/perfis/engenheiro-dados.md
          - Pesquisador acadêmico: guias/perfis/pesquisador.md
      - Receitas:
          - guias/receitas/index.md
          - Curva de Phillips brasileira: guias/receitas/curva-phillips.md
          - Yield Curve em 10 linhas: guias/receitas/yield-curve.md
          - Taxa real ex-post (Selic × IPCA): guias/receitas/taxa-real-ipca-selic.md
          - Mortalidade infantil × SUS: guias/receitas/mortalidade-sus.md
          - Estiagem no Nordeste: guias/receitas/estiagem-nordeste.md
          - Balança comercial em DuckDB: guias/receitas/balanca-duckdb.md
          - Time Travel — paper de 2019: guias/receitas/time-travel.md
          - Análise Econômica Multi-Fonte: guias/receitas/analise-economica-multi-fonte.md

  - Conceitos:
      - conceitos/index.md
      - Princípios de Design: conceitos/principios.md
      - Arquitetura do Ecossistema: conceitos/arquitetura.md
      - Padrões de execução: conceitos/padroes.md
      - Padrões de dados: conceitos/padroes-dados.md
      - Parquet + Polars: conceitos/parquet-polars.md
      - Convenções de Armazenamento: conceitos/storage.md
      - Proveniência & Manifestos: conceitos/proveniencia.md
      - Bulk Load & Versionamento: conceitos/bulk-load.md
      - Cálculo de Retornos (Renda Fixa): conceitos/calculo-retornos-renda-fixa.md

  - Contribuir:
      - contribuir.md
      - Configuração Global: normas/configuracao.md
      - Versão em pacotes Python: normas/python.md
      - Padrões de Escrita: normas/escrita.md
      - Padronização de CLI:
          - normas/cli-fetchers.md
          - CLI nativa (cli.py): normas/cli-fetchers/cli-nativa.md
          - Plugin (plugin.py): normas/cli-fetchers/plugin.md
          - Padrões visuais Rich: normas/cli-fetchers/rich.md
          - Progresso e logging: normas/cli-fetchers/progresso-e-logging.md
          - Erros, fluxos e anti-padrões: normas/cli-fetchers/erros-e-fluxos.md
      - Padronização de .gitignore: normas/gitignore.md
      - Padronização de pyproject.toml: normas/pyproject.md
      - Padronização de CHANGELOG.md: normas/changelog.md
      - Publicação e Release: normas/publicacao.md

  - Projeto:
      - Status das fontes: status.md
      - Roadmap: roadmap.md
      - Changelog: changelog.md

