        cookbook/estiagem-nordeste.md: guias/receitas/estiagem-nordeste.md
        cookbook/index.md: guias/receitas/index.md
        cookbook/mortalidade-sus.md: guias/receitas/mortalidade-sus.md
        cookbook/taxa-real-ipca-selic.md: guias/receitas/taxa-real-ipca-selic.md
        cookbook/time-travel.md: guias/receitas/time-travel.md
        cookbook/yield-curve.md: guias/receitas/yield-curve.md
